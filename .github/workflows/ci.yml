name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer
      - name: Run php-cs-fixer
        run: php-cs-fixer fix --diff --dry-run --config=.php-cs-fixer.php

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v6
      - run: make .docker/.env
      - run: $COMPOSE up -d --build --wait
        name: Start services
      - run: make analyse

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    env:
      PHP_VERSION: ${{ matrix.php }}
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v6
      - run: make .docker/.env
      - run: $COMPOSE up -d --build --wait
        name: Start services
      - run: mkdir -p reports
      - run: >-
          $COMPOSE exec app vendor/bin/phpunit
          --log-junit /app/coverage/phpunit-junit.xml
        name: Run PHPUnit
      - run: cp coverage/phpunit-junit.xml reports/phpunit-junit.xml
        if: always()
      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: PHPUnit Results (PHP ${{ matrix.php }})
          path: reports/phpunit-junit.xml
          reporter: java-junit
